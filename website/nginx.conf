map $http_accept $markdown_home {
    default /__missing_markdown__;
    ~*text/markdown /__markdown/index.md;
}

map $http_accept $markdown_privacidade {
    default /__missing_markdown__;
    ~*text/markdown /__markdown/privacidade.md;
}

map $http_accept $markdown_termos {
    default /__missing_markdown__;
    ~*text/markdown /__markdown/termos.md;
}

map $http_accept $markdown_suporte {
    default /__missing_markdown__;
    ~*text/markdown /__markdown/suporte.md;
}

map $http_accept $markdown_quem_somos {
    default /__missing_markdown__;
    ~*text/markdown /__markdown/quem-somos.md;
}

map $http_accept $markdown_docs_api {
    default /__missing_markdown__;
    ~*text/markdown /__markdown/docs-api.md;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Signal "ai-train=yes, search=yes, ai-input=yes" always;
    add_header Vary "Accept" always;
    add_header Link '</llms.txt>; rel="alternate"; type="text/markdown", </sitemap.xml>; rel="sitemap"; type="application/xml", </quem-somos>; rel="about"; type="text/html", </.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </docs/api>; rel="service-doc"; type="text/html", </docs/api/openapi.json>; rel="service-desc"; type="application/openapi+json"' always;

    location = / {
        types {
            text/html html;
            text/markdown md;
        }
        try_files $markdown_home /index.html =404;
    }

    location = /privacidade {
        types {
            text/html html;
            text/markdown md;
        }
        try_files $markdown_privacidade /privacidade.html =404;
    }

    location = /termos {
        types {
            text/html html;
            text/markdown md;
        }
        try_files $markdown_termos /termos.html =404;
    }

    location = /suporte {
        types {
            text/html html;
            text/markdown md;
        }
        try_files $markdown_suporte /suporte.html =404;
    }

    location = /quem-somos {
        types {
            text/html html;
            text/markdown md;
        }
        try_files $markdown_quem_somos /quem-somos.html =404;
    }

    location = /docs/api {
        types {
            text/html html;
            text/markdown md;
        }
        try_files $markdown_docs_api /docs/api.html =404;
    }

    location = /docs/api/ {
        return 308 /docs/api;
    }

    location = /privacidade/ {
        return 308 /privacidade;
    }

    location = /termos/ {
        return 308 /termos;
    }

    location = /suporte/ {
        return 308 /suporte;
    }

    location = /quem-somos/ {
        return 308 /quem-somos;
    }

    location ^~ /__markdown/ {
        types {
            text/markdown md;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # llms.txt - must be served as text/markdown for AI crawlers (GEO)
    location = /llms.txt {
        types { }
        default_type "text/markdown; charset=utf-8";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # agents.json - agent discovery (OpenAPI-based spec)
    location = /.well-known/agents.json {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Apple App Site Association - must be served as application/json
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /apple-app-site-association {
        default_type application/json;
        alias /usr/share/nginx/html/.well-known/apple-app-site-association;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Android asset links
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/agent-skills/index.json {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/\.well-known/agent-skills/.+/SKILL\.md$ {
        types {
            text/markdown md;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/mcp/server-card.json {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # MCP discovery - well-known path checked by agents/GEO crawlers
    location = /.well-known/mcp.json {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # /mcp shortcut - serves the same discovery document
    location = /mcp {
        default_type application/json;
        alias /usr/share/nginx/html/.well-known/mcp.json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /docs/api/openapi.json {
        types {
            application/openapi+json json;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Invite universal links: rewrite /invite/CODE to the static invite page
    # (Next.js output:export generates /invite/placeholder.html for the dynamic route)
    location /invite/ {
        try_files $uri $uri.html /invite/placeholder.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Clean URLs - serve .html without extension and preserve a real 404 status.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public";
    }
}
